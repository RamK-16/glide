name: Storybook Build and Deploy
on:
    push:
        branches: ["main"]
        paths: ["packages/core/**", "packages/cells/**", "packages/source/**"]
    workflow_dispatch:
permissions:
    contents: write
concurrency:
    group: "pages"
    cancel-in-progress: false
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.10.0
            - name: Install and Build 🔧
              run: |
                  npm install
                  npm run build-storybook
            - name: "Add .nojekyll 📄"
              run: cd storybook-build && touch .nojekyll
            - name: Deploy to GitHub Pages 🚀
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./storybook-build
                  # Не трогаем pr-preview/**, которые кладёт туда storybook-pr-preview.yml
                  keep_files: true
