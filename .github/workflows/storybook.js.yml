name: Storybook Build and Deploy
on:
    push:
        branches: ["main"]
        paths: ["packages/core/**", "packages/cells/**", "packages/source/**"]
    workflow_dispatch:
permissions:
    contents: write
concurrency:
    group: "pages"
    cancel-in-progress: false
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.10.0
            - name: Install and Build 🔧
              run: |
                  npm install
                  npm run build-storybook
            - name: "Add .nojekyll 📄"
              run: cd storybook-build && touch .nojekyll
            - name: Preserve active PR previews 🔒
              # Полная перезамена веток ниже стирает всё в gh-pages, поэтому
              # перед деплоем возвращаем в publish_dir текущее содержимое
              # pr-preview/**, которое кладёт туда storybook-pr-preview.yml,
              # чтобы не убить открытые превью и не плодить мусор от старых.
              run: |
                  git fetch origin gh-pages --depth=1 2>/dev/null || true
                  if git rev-parse --verify origin/gh-pages >/dev/null 2>&1 && \
                     git cat-file -e origin/gh-pages:pr-preview 2>/dev/null; then
                      git archive origin/gh-pages -- pr-preview | tar -x -C storybook-build
                      echo "Preserved existing pr-preview/ folder(s)"
                  else
                      echo "No active PR previews to preserve"
                  fi
            - name: Deploy to GitHub Pages 🚀
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./storybook-build
