name: Semantic Release
on:
    push:
        branches: ["main"]
permissions:
    contents: write
concurrency:
    group: semantic-release
    cancel-in-progress: false
jobs:
    release:
        runs-on: ubuntu-latest
        # Не запускаем на коммите, который сам semantic-release запушил (chore(release): ...),
        # иначе бесконечный цикл. Не используем "[skip ci]" тут намеренно — эта метка
        # глушит вообще все workflow'ы на пуш, включая node.js.yml/storybook.js.yml.
        #
        # Примечание: пуш из этой джобы делается через GITHUB_TOKEN, а такие пуши по
        # правилам GitHub Actions в принципе не каскадируют в другие workflow (в т.ч.
        # release.js.yml по тегу v*) — поэтому npm publish сделан прямо тут, через
        # @semantic-release/npm, а не через отдельный tag-triggered воркфлоу.
        if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: true

            - uses: actions/setup-node@v4
              with:
                  # semantic-release сам по себе требует Node ^22.14 || >=24.10 — это только
                  # версия для тулинга в этом job'е, на публикуемый пакет (Node 20.10.0 в
                  # остальных воркфлоу) никак не влияет.
                  node-version: "22"

            - name: Configure git identity 👤
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Install 🔧
              run: npm install

            - name: Build 🔨
              run: npm run build --workspaces

            - name: Install semantic-release plugins
              # conventional-changelog-angular ЗАПИНЕН на 8.3.1 намеренно: без версии
              # npm ставит latest (9.x), у которой другая карта exports без "." —
              # с ней падает generateNotes у release-notes-generator (MODULE_NOT_FOUND /
              # ERR_PACKAGE_PATH_NOT_EXPORTED). А без явного упоминания пакета вообще —
              # то, какая версия в итоге всплывёт в корень node_modules, недетерминированно
              # (зависит от остального дерева зависимостей монорепо: локально всплывала
              # рабочая 8.3.1, в CI — ломающая 9.3.0). Пин снимает эту неопределённость.
              run: |
                  npm install --no-save \
                      semantic-release \
                      @semantic-release/changelog \
                      @semantic-release/exec \
                      @semantic-release/git \
                      @semantic-release/github \
                      @semantic-release/npm \
                      conventional-changelog-angular@8.3.1

            - name: Release 🚀
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npx semantic-release

            - name: Rollback failed release ⏪
              # failCmd в .releaserc.json не годится: semantic-release вызывает
              # плагинный "fail"-шаг только для настоящих SemanticReleaseError
              # (невалидный конфиг/ветка и т.п.), а НЕ для сырых runtime-ошибок вроде
              # упавшего generateNotes — такие крашат процесс напрямую, минуя fail-хуки.
              # Поэтому откат — на уровне самой job'ы: если "Release 🚀" упал уже
              # после того, как @semantic-release/git закоммитил и запушил
              # chore(release) в main, откатываем этот коммит (и тег, если он уже
              # успел создаться), чтобы main не застревал в грязном состоянии.
              if: failure()
              run: ./rollback-release.sh
